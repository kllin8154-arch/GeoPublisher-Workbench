name: Verify and build desktop preview

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PROJ_NETWORK: "OFF"
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Linux Qt system library
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1
      - name: Install build tooling
        run: python -m pip install uv==0.13.4
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --extra desktop --extra packaging
      - name: Lint
        run: uv run --frozen --no-sync ruff check .
      - name: Qt background worker lifecycle
        timeout-minutes: 3
        run: uv run --frozen --no-sync pytest -q -ra -o faulthandler_timeout=15 tests/test_desktop.py
      - name: Full test suite with thread diagnostics
        timeout-minutes: 6
        run: uv run --frozen --no-sync pytest -q -ra -o faulthandler_timeout=20
      - name: Build Python wheel
        run: uv run --frozen --no-sync python -m build --no-isolation
      - name: Build Windows desktop preview
        if: runner.os == 'Windows'
        run: uv run --frozen --no-sync pyinstaller --noconfirm --clean --windowed --onedir --name GeoPublisher-Workbench --paths src --add-data "src/geopublisher/resources;geopublisher/resources" scripts/desktop_entry.py
      # The repository's Actions artifact quota is currently exhausted.
      # Keep lint/tests/Windows preview builds as required CI checks, and make
      # large preview uploads an explicit maintenance opt-in only.
      # Once storage is cleared, set repository variable
      # GEOPUBLISHER_UPLOAD_PREVIEWS=true and run workflow_dispatch.
      - name: Upload build artifacts (manual opt-in)
        if: ${{ github.event_name == 'workflow_dispatch' && vars.GEOPUBLISHER_UPLOAD_PREVIEWS == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GeoPublisher-preview-${{ runner.os }}
          path: dist/
          retention-days: 14

  macos-core:
    # Verify the SSH/SFTP core on macOS without claiming a native .app release.
    # Native desktop packaging requires separate signing/notarization work.
    runs-on: macos-15
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen
      PROJ_NETWORK: "OFF"
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install uv==0.13.4
      - name: Install locked CLI/core dependencies
        run: uv sync --frozen --extra dev
      - name: Lint
        run: uv run --frozen --no-sync ruff check .
      - name: macOS LAN SSH, safe archive, GeoServer REST core
        run: uv run --frozen --no-sync pytest -q -o faulthandler_timeout=20 tests/test_server_deploy.py tests/test_server_forward.py tests/test_server_plan.py tests/test_server_publish.py tests/test_catalog_live.py
      - name: Build Python wheel
        run: uv run --frozen --no-sync python -m build --no-isolation

  postgres16-readonly-integration:
    # Disposable synthetic PostgreSQL: run the *real* SQL/permissions path.
    # The service contains no customer schemas, maps or credentials.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: demo_db
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: test-only-admin-pg16-2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d demo_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      GEOPUB_SYNTHETIC_PG16_TEST: "1"
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install uv==0.13.4
      - name: Install locked runtime and test dependencies
        run: uv sync --frozen --extra dev
      - name: Run real PostgreSQL 16 read-only catalog test on synthetic schema
        run: uv run --frozen --no-sync pytest -q -o faulthandler_timeout=20 tests/test_catalog_live_postgres16.py
