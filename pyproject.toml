[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "geopublisher-workbench"
version = "0.1.0"
description = "Offline-first, auditable GeoServer publishing workbench"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<0.29",
    "Pillow>=11,<13",
    "defusedxml>=0.7,<0.8",
    "paramiko>=3.5,<5",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
desktop = ["PySide6-Essentials>=6.8,<7"]
packaging = ["pyinstaller>=6.16,<7"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1.2,<2", "hatchling>=1.26,<2"]

[project.scripts]
geopub = "geopublisher.cli:main"
geopub-desktop = "geopublisher.desktop:main"

[tool.hatch.build.targets.wheel]
packages = ["src/geopublisher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a disposable local GeoServer and GDAL runtime"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
